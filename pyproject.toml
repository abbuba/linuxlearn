[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxlearn"
version = "0.2.0"
description = "A terminal-native Linux learning environment with AI-assisted command discovery, safe execution, and interactive lessons."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Md Abubakar" }
]
dependencies = [
    "rich>=13.7",
    "openai>=1.0.0",
    "reportlab>=4.0.0"
]

[project.scripts]
linuxlearn = "linuxlearn.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]